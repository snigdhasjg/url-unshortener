# Snake_case JSON field names (original_url, final_url, stop_reason, ...) without
# per-field @JsonProperty annotations. Enum wire values use @JsonValue instead,
# since this strategy only affects property names, not enum constants.
quarkus:
  jackson:
    property-naming-strategy: SNAKE_CASE
  http:
    # Plain HTTP and HTTPS serve side by side; :80 is never redirected to :443.
    # This is the Quarkus default today, but it silently flips to `disabled` if
    # client-auth is ever set to `required` — pinned so that can't quietly kill :80.
    insecure-requests: enabled
  native:
    # Build-time only; irrelevant in JVM mode. Without it, native-image doesn't
    # register the "https" URL protocol handler, and every outbound HTTPS fetch
    # (i.e. resolving any https:// short link) throws MalformedURLException at
    # runtime — this is the resolver's core job, so it can't be conditional.
    enable-https-url-handler: true

resolver:
  default-profile: android

# UA profiles are named config, not hardcoded strings — see UaProfilesConfig.
# Chrome's *reduced* UA (UA Reduction): real Chrome on Android reports a frozen
# "Android 10; K" regardless of actual hardware. Don't "fix" this to look accurate.
ua-profiles:
  android:
    user-agent: "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Mobile Safari/537.36"
    sec-ch-ua: '"Chromium";v="151", "Google Chrome";v="151", "Not?A_Brand";v="24"'
    sec-ch-ua-mobile: "?1"
    sec-ch-ua-platform: '"Android"'
    accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
    accept-language: "en-US,en;q=0.9"

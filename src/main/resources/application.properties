# Snake_case JSON field names (original_url, final_url, stop_reason, ...) without
# per-field @JsonProperty annotations. Enum wire values use @JsonValue instead,
# since this strategy only affects property names, not enum constants.
quarkus.jackson.property-naming-strategy=SNAKE_CASE

resolver.default-profile=android

# UA profiles are named config, not hardcoded strings — see UaProfilesConfig.
# Chrome's *reduced* UA (UA Reduction): real Chrome on Android reports a frozen
# "Android 10; K" regardless of actual hardware. Don't "fix" this to look accurate.
ua-profiles.android.user-agent=Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Mobile Safari/537.36
ua-profiles.android.sec-ch-ua="Chromium";v="151", "Google Chrome";v="151", "Not?A_Brand";v="24"
ua-profiles.android.sec-ch-ua-mobile=?1
ua-profiles.android.sec-ch-ua-platform="Android"
ua-profiles.android.accept=text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
ua-profiles.android.accept-language=en-US,en;q=0.9

name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-slim
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
      tag: ${{ steps.semver.outputs.version_tag }}
      version: ${{ steps.semver.outputs.version }}
      previous_version: ${{ steps.semver.outputs.previous_version }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 100
          fetch-tags: true
          filter: blob:none

      - uses: paulhatch/semantic-version@v6.0.4
        id: semver
        with:
          tag_prefix: "v"
          major_pattern: "/!:|BREAKING CHANGE:|MAJOR:/i"
          minor_pattern: "/FEAT:|FEATURE:|MINOR:/i"
          bump_each_commit: true

  build:
    name: Build and publish
    runs-on: ubuntu-26.04
    needs:
      - version
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.version.outputs.commit }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            {
              echo "tags<<EOF"
              echo "ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}"
              echo "ghcr.io/${{ github.repository }}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "image_version=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            sha="${{ needs.version.outputs.commit }}"
            echo "tags=ghcr.io/${{ github.repository }}:${{ needs.version.outputs.previous_version }}-${sha:0:7}" >> "$GITHUB_OUTPUT"
            echo "image_version=${{ needs.version.outputs.previous_version }}-${sha:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/main/docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.description=Self-hosted URL unshortener. Given a shortened URL, walk the redirect chain and report the final destination plus the full path taken.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.title=unshortener
            org.opencontainers.image.version=${{ steps.tags.outputs.image_version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.commit }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            com.snigji.ci.id=${{ github.run_number }}
            com.snigji.ci.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          push: true

      - name: Create tag
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ needs.version.outputs.tag }}',
              sha: '${{ needs.version.outputs.commit }}'
            })

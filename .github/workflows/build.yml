name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_DESCRIPTION: >-
    Self-hosted URL unshortener. Given a shortened URL, walks the redirect
    chain and reports the final destination plus the hops taken, under a
    5-second ceiling.

jobs:
  version:
    name: Version
    runs-on: ubuntu-slim
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
      version: ${{ steps.semver.outputs.version }}
      tag: ${{ steps.semver.outputs.version_tag }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 100
          fetch-tags: true
          filter: blob:none

      - uses: paulhatch/semantic-version@v6.0.3
        id: semver
        with:
          tag_prefix: "v"
          major_pattern: "/!:|BREAKING CHANGE:|MAJOR:/i"
          minor_pattern: "/FEAT:|FEATURE:|MINOR:/i"
          bump_each_commit: true

  test:
    name: Test
    runs-on: ubuntu-26.04
    needs:
      - version
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.version.outputs.commit }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs:
      - version
      - test
    if: github.event_name == 'push'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Clone the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.version.outputs.commit }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build native executable
        run: |
          ./gradlew build -x test --no-daemon \
            -Dquarkus.native.enabled=true \
            -Dquarkus.package.jar.enabled=false \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.container-runtime=docker \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:25.0.4.1-Final-java25 \
            -Dquarkus.native.native-image-xmx=6g \
            -Dquarkus.native.march=compatibility

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/main/docker/Dockerfile.native-micro
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.title=unshortener
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.commit }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'linux-amd64' || 'linux-arm64' }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: Merge and publish
    runs-on: ubuntu-26.04
    needs:
      - version
      - build
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        id: merge
        working-directory: /tmp/digests
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker buildx imagetools create \
            --tag "${image}:${{ needs.version.outputs.version }}" \
            --tag "${image}:latest" \
            --annotation "index:org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.licenses=MPL-2.0" \
            --annotation "index:org.opencontainers.image.title=unshortener" \
            --annotation "index:org.opencontainers.image.version=${{ needs.version.outputs.version }}" \
            --annotation "index:org.opencontainers.image.revision=${{ needs.version.outputs.commit }}" \
            --annotation "index:org.opencontainers.image.url=https://github.com/${{ github.repository }}" \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

          digest=$(docker buildx imagetools inspect "${image}:${{ needs.version.outputs.version }}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

      - name: Create tag
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ needs.version.outputs.tag }}',
              sha: '${{ needs.version.outputs.commit }}'
            })
